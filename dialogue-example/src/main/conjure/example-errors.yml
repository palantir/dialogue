types:
  definitions:
    default-package: com.palantir.dialogue.example
    errors:
      # One of each error types
      PermissionDeniedError:
        namespace: Errors
        code: PERMISSION_DENIED
      InvalidArgumentError:
        namespace: Errors
        code: INVALID_ARGUMENT
      NotFoundError:
        namespace: Errors
        code: NOT_FOUND
      ConflictError:
        namespace: Errors
        code: CONFLICT
      RequestTooLargeError:
        namespace: Errors
        code: REQUEST_ENTITY_TOO_LARGE
      FailedPreconditionError:
        namespace: Errors
        code: FAILED_PRECONDITION
      InternalError:
        namespace: Errors
        code: INTERNAL
