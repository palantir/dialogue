services:
  SampleService:
    name: Sample Service
    package: com.palantir.dialogue.example
    default-auth: none
    endpoints:

      voidToVoid:
        http: GET /voidToVoid

      stringToVoid:
        http: GET /stringToVoid/{path}
        args:
          path: string

      objectToObject:
        http: POST /objectToObject/objects/{path}
        args:
          path: string
          header:
            param-id: HeaderKey
            type: datetime
            param-type: header
          queryKey:
            type: list<rid>
            param-type: query
          body: SampleObject
        returns: SampleObject

      getOptionalBinary:
        http: GET /getOptionalBinary
        returns: optional<binary>

      getMyAlias:
        http: GET /getMyAlias
        returns: AliasOfOptional

      getMyAlias2:
        http: GET /getMyAlias2
        returns: AliasOfAliasOfOptional

  # A service with many endpoints, to test memory allocations/consumption
  ManyEndpointsService:
    name: Sample service with many endpoints
    package: com.palantir.dialogue.example
    default-auth: none
    endpoints:
      voidToVoid:
        http: GET /voidToVoid

      stringToVoid:
